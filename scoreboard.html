<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MailMaster - Scoreboard</title>

    <!-- Fonts: Kanit for Thai, Inter for English -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- React & Libraries -->
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Framer Motion for Animations -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./firebase-config.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        onSnapshot,
        query,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = window.FIREBASE_CONFIG;
      if (!firebaseConfig) {
        console.error("Firebase Config not found!");
      }

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.firebaseData = {
        collection,
        onSnapshot,
        query,
        orderBy,
      };
    </script>

    <style>
      body {
        font-family: "Kanit", "Inter", sans-serif;
        background-color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const { motion, AnimatePresence } = window.Motion;

      const Icons = {
        Trophy: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
          </svg>
        ),
      };

      // --- Defines ---
      const CATEGORIES = [
        { id: "beauty", label: "✨ ความอลังการ/สวยงาม", icon: Icons.Trophy },
        { id: "realism", label: "🎭 ความเหมือนจริง", icon: Icons.Trophy },
        { id: "dedication", label: "💪 ความทุ่มเท", icon: Icons.Trophy },
      ];

      function App() {
        const [votesData, setVotesData] = useState([]);
        const [contestants, setContestants] = useState([]);

        useEffect(() => {
          if (!window.db) return;
          const { collection, onSnapshot, query, orderBy } =
            window.firebaseData;

          const qVotes = query(
            collection(window.db, "votes"),
            orderBy("timestamp", "desc")
          );
          const unsubVotes = onSnapshot(qVotes, (snapshot) => {
            setVotesData(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
            );
          });

          const qContestants = query(
            collection(window.db, "contestants"),
            orderBy("createdAt", "desc")
          );
          const unsubContestants = onSnapshot(qContestants, (snapshot) => {
            setContestants(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
            );
          });

          return () => {
            unsubVotes();
            unsubContestants();
          };
        }, []);

        const rankingsByCategory = useMemo(() => {
          // Initialize map structure: { beauty: { cId: count }, realism: {...}, ... }
          const counts = {};
          CATEGORIES.forEach((cat) => {
            counts[cat.id] = {};
            // Initialize all contestants with 0 votes in each category
            contestants.forEach((c) => {
              counts[cat.id][c.id] = { ...c, votesCount: 0 };
            });
          });

          // Tally votes
          votesData.forEach((v) => {
            const catId = v.category;
            const cId = v.contestantId;
            // Check if valid category and valid contestant (might be old data or deleted user)
            if (catId && counts[catId] && counts[catId][cId]) {
              counts[catId][cId].votesCount += 1;
            } else {
              // Handle legacy votes (no category)?
              // Maybe ignore them or assign to a default?
              // Creating a new feature usually implies new data. Ignoring legacy for now.
            }
          });

          // Convert to sorted arrays
          const result = {};
          CATEGORIES.forEach((cat) => {
            const sorted = Object.values(counts[cat.id])
              .sort((a, b) => b.votesCount - a.votesCount)
              .slice(0, 3); // Take Top 3

            // Only include if they have votes? Or show even with 0?
            // Usually top 3 implies best. If 0 votes, maybe don't show or show at bottom.
            // Let's show all top 3 even if 0 to fill the board?
            result[cat.id] = sorted;
          });

          return result;
        }, [votesData, contestants]);

        return (
          <div className="min-h-screen p-4 md:p-8 bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
            <div className="max-w-6xl mx-auto">
              <header className="text-center mb-10">
                <h1 className="text-4xl md:text-5xl font-extrabold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-3">
                  Live Scoreboard 🏆
                </h1>
                <p className="text-gray-500 text-lg">
                  ผลคะแนนล่าสุด Top 3 แต่ละหมวด
                </p>
              </header>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {CATEGORIES.map((cat) => (
                  <div
                    key={cat.id}
                    className="bg-white/60 backdrop-blur-sm rounded-3xl p-5 border border-white/50 shadow-sm flex flex-col"
                  >
                    <div className="flex items-center gap-2 mb-6 border-b border-gray-100 pb-4">
                      <span className="text-2xl">
                        {cat.label.split(" ")[0]}
                      </span>
                      <h2 className="font-bold text-xl text-gray-800">
                        {cat.label.split(" ").slice(1).join(" ")}
                      </h2>
                    </div>

                    <div className="space-y-3 flex-1">
                      {rankingsByCategory[cat.id].map((r, idx) => (
                        <motion.div
                          key={r.id}
                          layout
                          initial={{ opacity: 0, y: 10 }}
                          animate={{ opacity: 1, y: 0 }}
                          className="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3 relative overflow-hidden"
                        >
                          <div
                            className={`
                                w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg text-white shadow-md shrink-0
                                ${
                                  idx === 0
                                    ? "bg-gradient-to-br from-yellow-300 to-yellow-500"
                                    : idx === 1
                                    ? "bg-gradient-to-br from-gray-300 to-gray-500"
                                    : "bg-gradient-to-br from-orange-300 to-orange-500"
                                }
                            `}
                          >
                            {idx + 1}
                          </div>

                          <div className="flex-1 min-w-0">
                            <h4 className="font-bold text-gray-900 truncate text-sm">
                              {r.name}
                            </h4>
                            <p className="text-xs text-gray-500 truncate">
                              {r.costumeTitle}
                            </p>
                          </div>

                          <div className="text-right pl-2 shrink-0">
                            <span className="block text-xl font-black bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                              {r.votesCount}
                            </span>
                          </div>
                        </motion.div>
                      ))}

                      {rankingsByCategory[cat.id].length === 0 && (
                        <div className="text-center py-8 text-gray-400">
                          <p className="text-sm">รอผลคะแนน...</p>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
