<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PartyPulse - Scoreboard</title>

    <!-- Fonts: Kanit for Thai, Inter for English -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- React & Libraries -->
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Framer Motion for Animations -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./firebase-config.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        onSnapshot,
        query,
        orderBy,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = window.FIREBASE_CONFIG;
      if (!firebaseConfig) {
        console.error("Firebase Config not found!");
      }

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.firebaseData = {
        collection,
        onSnapshot,
        query,
        orderBy,
      };
    </script>

    <style>
      body {
        font-family: "Kanit", "Inter", sans-serif;
        background-color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const { motion, AnimatePresence } = window.Motion;

      const TEAMS = {
        pink: {
          name: "Team Pink",
          color: "text-pink-600",
          bg: "bg-pink-50",
          border: "border-pink-200",
          gradient: "from-pink-500 to-rose-500",
        },
        blue: {
          name: "Team Blue",
          color: "text-blue-600",
          bg: "bg-blue-50",
          border: "border-blue-200",
          gradient: "from-blue-500 to-cyan-500",
        },
        green: {
          name: "Team Green",
          color: "text-green-600",
          bg: "bg-green-50",
          border: "border-green-200",
          gradient: "from-green-500 to-emerald-500",
        },
        yellow: {
          name: "Team Yellow",
          color: "text-yellow-600",
          bg: "bg-yellow-50",
          border: "border-yellow-200",
          gradient: "from-yellow-400 to-amber-500",
        },
      };

      const Icons = {
        Trophy: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
          </svg>
        ),
      };

      const TeamBadge = ({ team, size = "sm" }) => {
        const t = TEAMS[team];
        const sizeClass =
          size === "lg" ? "px-4 py-2 text-base" : "px-2.5 py-1 text-xs";
        return (
          <span
            className={`${sizeClass} rounded-full font-bold ${t.bg} ${t.color} border ${t.border}`}
          >
            {t.name}
          </span>
        );
      };

      function App() {
        const [votesData, setVotesData] = useState([]);
        const [contestants, setContestants] = useState([]);

        useEffect(() => {
          if (!window.db) return;
          const { collection, onSnapshot, query, orderBy } =
            window.firebaseData;

          const qVotes = query(
            collection(window.db, "votes"),
            orderBy("timestamp", "desc")
          );
          const unsubVotes = onSnapshot(qVotes, (snapshot) => {
            setVotesData(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
            );
          });

          const qContestants = query(
            collection(window.db, "contestants"),
            orderBy("createdAt", "desc")
          );
          const unsubContestants = onSnapshot(qContestants, (snapshot) => {
            setContestants(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
            );
          });

          return () => {
            unsubVotes();
            unsubContestants();
          };
        }, []);

        const rankings = useMemo(() => {
          const map = {};
          contestants.forEach((c) => {
            map[c.id] = { ...c, votesCount: 0 };
          });
          votesData.forEach((v) => {
            if (map[v.contestantId]) {
              map[v.contestantId].votesCount += 1;
            }
          });
          return Object.values(map).sort((a, b) => b.votesCount - a.votesCount);
        }, [votesData, contestants]);

        return (
          <div className="min-h-screen p-6 bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
            <div className="max-w-2xl mx-auto">
              <header className="text-center mb-8">
                <h1 className="text-4xl font-extrabold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                  Live Scoreboard 🏆
                </h1>
                <p className="text-gray-500">ผลคะแนนล่าสุด (Real-time)</p>
              </header>

              <div className="space-y-3">
                {rankings.map((r, idx) => (
                  <motion.div
                    key={r.id}
                    layout
                    initial={{ opacity: 0, y: 20 }}
                    animate={{ opacity: 1, y: 0 }}
                    className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 relative overflow-hidden group"
                  >
                    <div
                      className={`
                          w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl text-white shadow-lg shrink-0
                          ${
                            idx === 0
                              ? "bg-gradient-to-br from-yellow-300 to-yellow-500"
                              : idx === 1
                              ? "bg-gradient-to-br from-gray-300 to-gray-500"
                              : idx === 2
                              ? "bg-gradient-to-br from-orange-300 to-orange-500"
                              : "bg-gray-100 text-gray-500 shadow-none"
                          }
                      `}
                    >
                      {idx === 0 ? "👑" : idx + 1}
                    </div>

                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-1">
                        <h4 className="font-bold text-gray-900 text-lg truncate">
                          {r.name}
                        </h4>
                        <TeamBadge team={r.team} />
                      </div>
                      <p className="text-sm text-gray-500 truncate">
                        {r.costumeTitle}
                      </p>
                    </div>

                    <div className="text-right pl-4 shrink-0">
                      <span className="block text-3xl font-black bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                        {r.votesCount}
                      </span>
                      <span className="text-xs text-gray-400 block">คะแนน</span>
                    </div>
                  </motion.div>
                ))}

                {rankings.length === 0 && (
                  <div className="text-center py-12 text-gray-400">
                    <Icons.Trophy />
                    <p className="mt-2 text-sm">ยังไม่มีผู้เข้าประกวด</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
