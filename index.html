<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PartyPulse - Costume Voting</title>

    <!-- Fonts: Kanit for Thai, Inter for English -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- React & Libraries -->
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Framer Motion for Animations -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./firebase-config.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        query,
        orderBy,
        serverTimestamp,
        deleteDoc,
        doc,
        where,
        getDocs,
        writeBatch,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      // --- 2. แก้ตรงนี้: ลบ Key เดิมออก แล้วให้อ่านจาก window แทน ---
      const firebaseConfig = window.FIREBASE_CONFIG;

      // Initialize Firebase
      // เพิ่มการเช็ค error เผื่อ config ไม่มา
      if (!firebaseConfig) {
        console.error(
          "Firebase Config not found! Make sure firebase-config.js is generated."
        );
      }

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Expose to window for React component to use
      window.db = db;
      window.firebaseData = {
        collection,
        addDoc,
        onSnapshot,
        query,
        orderBy,
        serverTimestamp,
        deleteDoc,
        doc,
        where,
        getDocs,
        writeBatch,
      };
    </script>

    <style>
      body {
        font-family: "Kanit", "Inter", sans-serif;
        background-color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const { motion, AnimatePresence } = window.Motion;

      const TEAMS = {
        pink: {
          name: "Team Pink",
          color: "text-pink-600",
          bg: "bg-pink-50",
          border: "border-pink-200",
          gradient: "from-pink-500 to-rose-500",
        },
        blue: {
          name: "Team Blue",
          color: "text-blue-600",
          bg: "bg-blue-50",
          border: "border-blue-200",
          gradient: "from-blue-500 to-cyan-500",
        },
        green: {
          name: "Team Green",
          color: "text-green-600",
          bg: "bg-green-50",
          border: "border-green-200",
          gradient: "from-green-500 to-emerald-500",
        },
        yellow: {
          name: "Team Yellow",
          color: "text-yellow-600",
          bg: "bg-yellow-50",
          border: "border-yellow-200",
          gradient: "from-yellow-400 to-amber-500",
        },
      };

      // --- Icon Components (SVG) ---
      const Icons = {
        Trophy: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
          </svg>
        ),
        Sparkles: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
            <path d="M5 3v4" />
            <path d="M9 5h4" />
            <path d="M19 17v4" />
            <path d="M15 19h4" />
          </svg>
        ),
        Palette: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <circle cx="13.5" cy="6.5" r=".5" />
            <circle cx="17.5" cy="10.5" r=".5" />
            <circle cx="8.5" cy="7.5" r=".5" />
            <circle cx="6.5" cy="12.5" r=".5" />
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.109 0-1.422 1.153-2.578 2.578-2.578 3.067 0 5.414-2.18 5.414-5.414 0-3.632-2.75-6.086-6.328-6.086z" />
          </svg>
        ),
        Heart: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
          </svg>
        ),
        LogOut: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" x2="9" y1="12" y2="12" />
          </svg>
        ),
        User: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        ),
        Shirt: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z" />
          </svg>
        ),
      };

      const Button = ({
        children,
        onClick,
        className = "",
        variant = "primary",
        disabled = false,
      }) => {
        const baseStyle =
          "relative px-4 py-3 rounded-xl font-semibold transition-all duration-200 active:scale-95 flex items-center justify-center gap-2 overflow-hidden";
        const variants = {
          primary:
            "bg-gray-900 text-white shadow-lg shadow-gray-200 hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed",
          outline:
            "border-2 border-gray-200 text-gray-700 hover:bg-gray-50 bg-white",
          ghost:
            "text-gray-500 hover:text-gray-700 bg-transparent hover:bg-gray-100",
        };
        return (
          <button
            disabled={disabled}
            onClick={onClick}
            className={`${baseStyle} ${variants[variant]} ${className}`}
          >
            {children}
          </button>
        );
      };

      const TeamBadge = ({ team, size = "sm" }) => {
        const t = TEAMS[team];
        const sizeClass =
          size === "lg" ? "px-4 py-2 text-base" : "px-2.5 py-1 text-xs";
        return (
          <span
            className={`${sizeClass} rounded-full font-bold ${t.bg} ${t.color} border ${t.border}`}
          >
            {t.name}
          </span>
        );
      };

      const ScoreInput = ({
        label,
        value,
        onChange,
        icon: Icon,
        colorClass,
      }) => (
        <div className="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
          <div className="flex justify-between items-center">
            <div
              className={`flex items-center gap-2 font-semibold ${colorClass}`}
            >
              <Icon />
              {label}
            </div>
            <span className="text-2xl font-bold text-gray-900">{value}</span>
          </div>
          <div className="flex gap-1">
            {[0, 1, 2, 3, 4, 5].map((score) => (
              <button
                key={score}
                onClick={() => onChange(score)}
                className={`
                                flex-1 h-10 rounded-lg transition-all font-bold text-sm
                                ${
                                  value === score
                                    ? `bg-gray-900 text-white scale-110 shadow-md ring-2 ring-offset-2 ring-gray-200`
                                    : "bg-gray-100 text-gray-400 hover:bg-gray-200"
                                }
                            `}
              >
                {score}
              </button>
            ))}
          </div>
        </div>
      );

      function App() {
        // User State
        const [user, setUser] = useState(() => {
          const saved = localStorage.getItem("party_user");
          return saved ? JSON.parse(saved) : null;
        });
        const [tempName, setTempName] = useState("");
        const [tempTeam, setTempTeam] = useState(null);
        const [tempCostume, setTempCostume] = useState("");
        const [isRegistering, setIsRegistering] = useState(false);

        // App State
        const [activeTab, setActiveTab] = useState("vote"); // 'vote' | 'leaderboard'
        const [selectedContestant, setSelectedContestant] = useState(null);
        const [scores, setScores] = useState({
          creative: 0,
          theme: 0,
          dedication: 0,
        });
        const [isSubmitting, setIsSubmitting] = useState(false);

        // Data State
        const [votesData, setVotesData] = useState([]);
        const [contestants, setContestants] = useState([]); // Dynamic Contestants List

        // 1. Firebase Listeners
        useEffect(() => {
          if (!window.db) {
            console.error("Firebase not initialized.");
            return;
          }
          const { collection, onSnapshot, query, orderBy } =
            window.firebaseData;

          // Listen to Votes
          const qVotes = query(
            collection(window.db, "votes"),
            orderBy("timestamp", "desc")
          );
          const unsubVotes = onSnapshot(qVotes, (snapshot) => {
            setVotesData(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
            );
          });

          // Listen to Contestants (New Logic!)
          const qContestants = query(
            collection(window.db, "contestants"),
            orderBy("createdAt", "desc")
          );
          const unsubContestants = onSnapshot(qContestants, (snapshot) => {
            setContestants(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
            );
          });

          return () => {
            unsubVotes();
            unsubContestants();
          };
        }, []);

        // Calculate Rankings
        const rankings = useMemo(() => {
          const map = {};
          // Initialize scores from dynamic contestants
          contestants.forEach((c) => {
            map[c.id] = { ...c, score: 0, votesCount: 0 };
          });

          // Aggregate vote
          votesData.forEach((v) => {
            if (map[v.contestantId]) {
              map[v.contestantId].score += v.creative + v.theme + v.dedication;
              map[v.contestantId].votesCount += 1;
            }
          });

          return Object.values(map).sort((a, b) => b.score - a.score);
        }, [votesData, contestants]);

        // Handlers
        const handleRegister = async () => {
          if (!tempName || !tempTeam || !tempCostume) return;
          setIsRegistering(true);
          try {
            const { collection, addDoc, serverTimestamp } = window.firebaseData;

            // Add user to 'contestants' collection
            const docRef = await addDoc(collection(window.db, "contestants"), {
              name: tempName,
              team: tempTeam,
              costumeTitle: tempCostume,
              createdAt: serverTimestamp(),
            });

            // Save local session
            const userData = {
              id: docRef.id,
              name: tempName,
              team: tempTeam,
              costumeTitle: tempCostume,
            };
            localStorage.setItem("party_user", JSON.stringify(userData));
            setUser(userData);
          } catch (error) {
            console.error("Error registering:", error);
            alert("เกิดข้อผิดพลาดในการลงทะเบียน");
          } finally {
            setIsRegistering(false);
          }
        };

        const handleLogout = async () => {
          if (
            confirm(
              "ทบทวนอีกครั้ง: การออกจากระบบจะลบข้อมูลการลงทะเบียนและคะแนนที่คุณโหวตทั้งหมด คุณแน่ใจหรือไม่?"
            )
          ) {
            try {
              const {
                deleteDoc,
                doc,
                collection,
                query,
                where,
                getDocs,
                writeBatch,
              } = window.firebaseData;

              // 1. Delete Contestant
              if (user.id) {
                await deleteDoc(doc(window.db, "contestants", user.id));
              }

              // 2. Delete Votes by this user
              const qVotes = query(
                collection(window.db, "votes"),
                where("voterName", "==", user.name),
                where("voterTeam", "==", user.team)
              );
              const snapshot = await getDocs(qVotes);

              const batch = writeBatch(window.db);
              snapshot.docs.forEach((doc) => {
                batch.delete(doc.ref);
              });
              await batch.commit();

              // 3. Clear Local State
              localStorage.removeItem("party_user");
              setUser(null);
              setTempName("");
              setTempTeam(null);
              setTempCostume("");
            } catch (error) {
              console.error("Error during cleanup:", error);
              alert("เกิดข้อผิดพลาดในการลบข้อมูล แต่จะทำการออกจากระบบ");
              // Fallback force logout
              localStorage.removeItem("party_user");
              setUser(null);
              setTempName("");
              setTempTeam(null);
              setTempCostume("");
            }
          }
        };

        const submitVote = async () => {
          if (!window.db) return;

          setIsSubmitting(true);
          try {
            const { collection, addDoc, serverTimestamp } = window.firebaseData;
            await addDoc(collection(window.db, "votes"), {
              voterName: user.name,
              voterTeam: user.team,
              contestantId: selectedContestant.id,
              creative: scores.creative,
              theme: scores.theme,
              dedication: scores.dedication,
              timestamp: serverTimestamp(),
            });

            setSelectedContestant(null);
            setScores({ creative: 0, theme: 0, dedication: 0 });

            const toast = document.createElement("div");
            toast.className =
              "fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-xl z-50 animate-bounce font-medium";
            toast.innerText = "✅ ส่งคะแนนเรียบร้อย!";
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
          } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการส่งคะแนน");
          } finally {
            setIsSubmitting(false);
          }
        };

        // Views
        if (!user) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
              <motion.div
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                className="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white"
              >
                <div className="text-center mb-8">
                  <h1 className="text-4xl font-extrabold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                    PartyPulse
                  </h1>
                  <p className="text-gray-500">
                    ลงทะเบียนคอสตูมของคุณเพื่อเริ่มงาน
                  </p>
                </div>

                <div className="space-y-5">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      ชื่อของคุณ
                    </label>
                    <input
                      type="text"
                      className="w-full px-4 py-3 rounded-xl bg-gray-50 border-2 border-gray-100 focus:border-purple-500 focus:ring-0 outline-none transition-all"
                      placeholder="เช่น น้องมายด์ บัญชี"
                      value={tempName}
                      onChange={(e) => setTempName(e.target.value)}
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      ชื่อชุดคอสตูมของคุณ (Costume Title)
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <Icons.Shirt />
                      </div>
                      <input
                        type="text"
                        className="w-full pl-10 pr-4 py-3 rounded-xl bg-gray-50 border-2 border-gray-100 focus:border-purple-500 focus:ring-0 outline-none transition-all"
                        placeholder="เช่น ราชินีเอลซ่า"
                        value={tempCostume}
                        onChange={(e) => setTempCostume(e.target.value)}
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      ทีมสีของคุณ
                    </label>
                    <div className="grid grid-cols-2 gap-3">
                      {Object.entries(TEAMS).map(([key, t]) => (
                        <button
                          key={key}
                          onClick={() => setTempTeam(key)}
                          className={`
                                                    p-3 rounded-xl border-2 transition-all text-sm font-semibold flex items-center justify-center gap-2
                                                    ${
                                                      tempTeam === key
                                                        ? `${t.bg} ${t.border} ${t.color} ring-2 ring-offset-1 ring-${key}-400`
                                                        : "border-gray-100 hover:border-gray-200 text-gray-500 bg-white"
                                                    }
                                                `}
                        >
                          <div
                            className={`w-3 h-3 rounded-full bg-gradient-to-br ${t.gradient}`}
                          ></div>
                          {t.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <Button
                    onClick={handleRegister}
                    disabled={
                      !tempName || !tempTeam || !tempCostume || isRegistering
                    }
                    className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-purple-200 mt-4"
                  >
                    {isRegistering
                      ? "กำลังบันทึก..."
                      : "ลงทะเบียนและเข้างาน 🎉"}
                  </Button>
                </div>
              </motion.div>
            </div>
          );
        }

        return (
          <div className="min-h-screen pb-24 max-w-md mx-auto relative bg-gray-50/50">
            {/* Header */}
            <header className="sticky top-0 z-20 glass-panel px-6 py-4 flex justify-between items-center rounded-b-3xl shadow-sm">
              <div>
                <h2 className="font-bold text-xl bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                  PartyPulse
                </h2>
                <div className="flex items-center gap-2 mt-1">
                  <span className="text-xs text-gray-500 truncate max-w-[120px]">
                    {user.name} ({user.costumeTitle})
                  </span>
                  <TeamBadge team={user.team} />
                </div>
              </div>
              <Button variant="ghost" onClick={handleLogout} className="!p-2">
                <Icons.LogOut />
              </Button>
            </header>

            {/* Tab Switcher */}
            <div className="px-6 mt-6 mb-4">
              <div className="bg-white p-1 rounded-2xl shadow-sm border border-gray-100 flex relative">
                <motion.div
                  className="absolute top-1 bottom-1 bg-gray-900 rounded-xl shadow-md"
                  initial={false}
                  animate={{
                    left: activeTab === "vote" ? "4px" : "50%",
                    width: "calc(50% - 4px)",
                  }}
                  transition={{ type: "spring", stiffness: 300, damping: 30 }}
                />
                <button
                  onClick={() => setActiveTab("vote")}
                  className={`flex-1 py-2.5 text-sm font-semibold relative z-10 transition-colors ${
                    activeTab === "vote" ? "text-white" : "text-gray-500"
                  }`}
                >
                  โหวต
                </button>
                <button
                  onClick={() => setActiveTab("leaderboard")}
                  className={`flex-1 py-2.5 text-sm font-semibold relative z-10 transition-colors ${
                    activeTab === "leaderboard" ? "text-white" : "text-gray-500"
                  }`}
                >
                  ผลคะแนน 🏆
                </button>
              </div>
            </div>

            {/* Content Area */}
            <main className="px-4 space-y-4">
              <AnimatePresence mode="wait">
                {activeTab === "vote" ? (
                  <motion.div
                    key="vote"
                    initial={{ opacity: 0, x: -20 }}
                    animate={{ opacity: 1, x: 0 }}
                    exit={{ opacity: 0, x: 20 }}
                    className="space-y-6"
                  >
                    {Object.entries(TEAMS).map(([teamKey, teamData]) => {
                      // Filter contestants dynamically from DB state
                      const teamMembers = contestants.filter(
                        (c) => c.team === teamKey
                      );

                      return (
                        <div
                          key={teamKey}
                          className={`rounded-3xl p-5 ${teamData.bg} border ${teamData.border} relative overflow-hidden transition-all duration-300`}
                        >
                          <div
                            className={`absolute -right-4 -top-4 w-24 h-24 bg-gradient-to-br ${teamData.gradient} opacity-10 rounded-full blur-2xl`}
                          ></div>

                          <h3
                            className={`font-bold text-lg mb-4 flex items-center gap-2 ${teamData.color}`}
                          >
                            <div
                              className={`w-2 h-6 rounded-full bg-gradient-to-b ${teamData.gradient}`}
                            ></div>
                            {teamData.name}
                            <span className="text-xs opacity-60 font-normal">
                              ({teamMembers.length} คน)
                            </span>
                          </h3>

                          {user.team === teamKey ? (
                            <div className="bg-white/60 backdrop-blur-sm rounded-xl p-6 text-center border border-white/50">
                              <p className="text-gray-500 text-sm font-medium">
                                ✨ นี่คือทีมของคุณ
                              </p>
                              <p className="text-xs text-gray-400 mt-1">
                                คุณ: {user.costumeTitle} ({user.name})
                              </p>
                            </div>
                          ) : (
                            <div className="space-y-3">
                              {teamMembers.length === 0 ? (
                                <div className="text-center py-4 text-gray-400 text-xs bg-white/40 rounded-xl">
                                  ยังไม่มีผู้ลงทะเบียนในทีมนี้
                                </div>
                              ) : (
                                teamMembers.map((contestant) => {
                                  const hasVoted = votesData.some(
                                    (v) =>
                                      v.voterName === user.name &&
                                      v.contestantId === contestant.id
                                  );

                                  return (
                                    <div
                                      key={contestant.id}
                                      className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center relative overflow-hidden"
                                    >
                                      {hasVoted && (
                                        <div className="absolute inset-0 bg-gray-50/80 backdrop-blur-[1px] flex items-center justify-center z-10">
                                          <span className="text-xs font-bold text-green-600 bg-green-100 px-3 py-1 rounded-full border border-green-200">
                                            โหวตแล้ว ✅
                                          </span>
                                        </div>
                                      )}
                                      <div className="flex-1 min-w-0 pr-2">
                                        <p className="font-bold text-gray-900 truncate">
                                          {contestant.costumeTitle}
                                        </p>
                                        <div className="flex items-center gap-1.5 mt-1">
                                          <Icons.User />
                                          <span className="text-xs text-gray-500 truncate">
                                            {contestant.name}
                                          </span>
                                        </div>
                                      </div>
                                      <Button
                                        onClick={() =>
                                          setSelectedContestant(contestant)
                                        }
                                        disabled={hasVoted}
                                        className="h-9 px-4 text-xs bg-gray-900 text-white shrink-0"
                                      >
                                        ให้คะแนน
                                      </Button>
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </motion.div>
                ) : (
                  <motion.div
                    key="leaderboard"
                    initial={{ opacity: 0, x: 20 }}
                    animate={{ opacity: 1, x: 0 }}
                    exit={{ opacity: 0, x: -20 }}
                    className="space-y-3"
                  >
                    {rankings.map((r, idx) => (
                      <div
                        key={r.id}
                        className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 relative overflow-hidden group"
                      >
                        <div
                          className={`
                                                w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shadow-lg shrink-0
                                                ${
                                                  idx === 0
                                                    ? "bg-gradient-to-br from-yellow-300 to-yellow-500"
                                                    : idx === 1
                                                    ? "bg-gradient-to-br from-gray-300 to-gray-500"
                                                    : idx === 2
                                                    ? "bg-gradient-to-br from-orange-300 to-orange-500"
                                                    : "bg-gray-100 text-gray-500 shadow-none"
                                                }
                                            `}
                        >
                          {idx === 0 ? "👑" : idx + 1}
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-1">
                            <h4 className="font-bold text-gray-900 truncate">
                              {r.costumeTitle}
                            </h4>
                            <TeamBadge team={r.team} />
                          </div>
                          <p className="text-xs text-gray-500 truncate">
                            {r.name}
                          </p>
                        </div>

                        <div className="text-right pl-2 shrink-0">
                          <span className="block text-xl font-black bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                            {r.score}
                          </span>
                          <span className="text-[10px] text-gray-400">
                            จาก {r.votesCount} โหวต
                          </span>
                        </div>

                        {/* Progress Bar Background */}
                        <div
                          className="absolute bottom-0 left-0 h-1 bg-gradient-to-r from-indigo-500 to-purple-500 opacity-20"
                          style={{
                            width: `${
                              (r.score /
                                ((rankings.length > 0 && rankings[0].score) ||
                                  1)) *
                              100
                            }%`,
                          }}
                        />
                      </div>
                    ))}

                    {rankings.length === 0 && (
                      <div className="text-center py-12 text-gray-400">
                        <Icons.Trophy />
                        <p className="mt-2 text-sm">ยังไม่มีผู้เข้าประกวด</p>
                      </div>
                    )}
                  </motion.div>
                )}
              </AnimatePresence>
            </main>

            {/* Vote Modal */}
            <AnimatePresence>
              {selectedContestant && (
                <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center pointer-events-none">
                  <motion.div
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    className="absolute inset-0 bg-black/40 backdrop-blur-sm pointer-events-auto"
                    onClick={() => setSelectedContestant(null)}
                  />
                  <motion.div
                    initial={{ y: "100%" }}
                    animate={{ y: 0 }}
                    exit={{ y: "100%" }}
                    transition={{ type: "spring", damping: 25, stiffness: 200 }}
                    className="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-8 shadow-2xl relative z-50 pointer-events-auto sm:m-4 max-h-[90vh] overflow-y-auto"
                  >
                    <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>

                    <div className="text-center mb-8">
                      <TeamBadge team={selectedContestant.team} size="lg" />
                      <h3 className="text-2xl font-bold text-gray-900 mt-3">
                        {selectedContestant.costumeTitle}
                      </h3>
                      <p className="text-gray-500">{selectedContestant.name}</p>
                    </div>

                    <div className="space-y-4">
                      <ScoreInput
                        label="ความคิดสร้างสรรค์"
                        value={scores.creative}
                        onChange={(v) => setScores({ ...scores, creative: v })}
                        icon={Icons.Sparkles}
                        colorClass="text-yellow-500"
                      />
                      <ScoreInput
                        label="ตรงตามธีม"
                        value={scores.theme}
                        onChange={(v) => setScores({ ...scores, theme: v })}
                        icon={Icons.Palette}
                        colorClass="text-purple-500"
                      />
                      <ScoreInput
                        label="ความทุ่มเท"
                        value={scores.dedication}
                        onChange={(v) =>
                          setScores({ ...scores, dedication: v })
                        }
                        icon={Icons.Heart}
                        colorClass="text-red-500"
                      />
                    </div>

                    <div className="flex gap-3 mt-8">
                      <Button
                        variant="ghost"
                        className="flex-1"
                        onClick={() => setSelectedContestant(null)}
                      >
                        ยกเลิก
                      </Button>
                      <Button
                        className="flex-[2] bg-gradient-to-r from-gray-900 to-gray-800"
                        onClick={submitVote}
                        disabled={isSubmitting}
                      >
                        {isSubmitting ? "กำลังส่ง..." : "ยืนยันคะแนน"}
                      </Button>
                    </div>
                  </motion.div>
                </div>
              )}
            </AnimatePresence>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
