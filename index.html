<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MailMaster - Costume Voting</title>

    <!-- Fonts: Kanit for Thai, Inter for English -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Kanit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- React & Libraries -->
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Framer Motion for Animations -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./firebase-config.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        query,
        orderBy,
        serverTimestamp,
        deleteDoc,
        doc,
        where,
        getDocs,
        writeBatch,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      // --- 2. แก้ตรงนี้: ลบ Key เดิมออก แล้วให้อ่านจาก window แทน ---
      const firebaseConfig = window.FIREBASE_CONFIG;

      // Initialize Firebase
      // เพิ่มการเช็ค error เผื่อ config ไม่มา
      if (!firebaseConfig) {
        console.error(
          "Firebase Config not found! Make sure firebase-config.js is generated."
        );
      }

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Expose to window for React component to use
      window.db = db;
      window.firebaseData = {
        collection,
        addDoc,
        onSnapshot,
        query,
        orderBy,
        serverTimestamp,
        deleteDoc,
        doc,
        where,
        getDocs,
        writeBatch,
      };
    </script>

    <style>
      body {
        font-family: "Kanit", "Inter", sans-serif;
        background-color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const { motion, AnimatePresence } = window.Motion;

      const TEAMS = {
        pink: {
          name: "Team Pink",
          color: "text-pink-600",
          bg: "bg-pink-50",
          border: "border-pink-200",
          gradient: "from-pink-500 to-rose-500",
        },
        blue: {
          name: "Team Blue",
          color: "text-blue-600",
          bg: "bg-blue-50",
          border: "border-blue-200",
          gradient: "from-blue-500 to-cyan-500",
        },
        green: {
          name: "Team Green",
          color: "text-green-600",
          bg: "bg-green-50",
          border: "border-green-200",
          gradient: "from-green-500 to-emerald-500",
        },
        yellow: {
          name: "Team Yellow",
          color: "text-yellow-600",
          bg: "bg-yellow-50",
          border: "border-yellow-200",
          gradient: "from-yellow-400 to-amber-500",
        },
      };

      // --- Icon Components (SVG) ---
      const Icons = {
        Trophy: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
          </svg>
        ),
        Sparkles: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
            <path d="M5 3v4" />
            <path d="M9 5h4" />
            <path d="M19 17v4" />
            <path d="M15 19h4" />
          </svg>
        ),
        Palette: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <circle cx="13.5" cy="6.5" r=".5" />
            <circle cx="17.5" cy="10.5" r=".5" />
            <circle cx="8.5" cy="7.5" r=".5" />
            <circle cx="6.5" cy="12.5" r=".5" />
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.109 0-1.422 1.153-2.578 2.578-2.578 3.067 0 5.414-2.18 5.414-5.414 0-3.632-2.75-6.086-6.328-6.086z" />
          </svg>
        ),
        Heart: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
          </svg>
        ),
        LogOut: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" x2="9" y1="12" y2="12" />
          </svg>
        ),
        User: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        ),
        Shirt: () => (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
          >
            <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z" />
          </svg>
        ),
      };

      const Button = ({
        children,
        onClick,
        className = "",
        variant = "primary",
        disabled = false,
      }) => {
        const baseStyle =
          "relative px-4 py-3 rounded-xl font-semibold transition-all duration-200 active:scale-95 flex items-center justify-center gap-2 overflow-hidden";
        const variants = {
          primary:
            "bg-gray-900 text-white shadow-lg shadow-gray-200 hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed",
          outline:
            "border-2 border-gray-200 text-gray-700 hover:bg-gray-50 bg-white",
          ghost:
            "text-gray-500 hover:text-gray-700 bg-transparent hover:bg-gray-100",
        };
        return (
          <button
            disabled={disabled}
            onClick={onClick}
            className={`${baseStyle} ${variants[variant]} ${className}`}
          >
            {children}
          </button>
        );
      };

      const TeamBadge = ({ team, size = "sm" }) => {
        const t = TEAMS[team];
        const sizeClass =
          size === "lg" ? "px-4 py-2 text-base" : "px-2.5 py-1 text-xs";
        return (
          <span
            className={`${sizeClass} rounded-full font-bold ${t.bg} ${t.color} border ${t.border}`}
          >
            {t.name}
          </span>
        );
      };

      const ScoreInput = ({
        label,
        value,
        onChange,
        icon: Icon,
        colorClass,
      }) => (
        <div className="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
          <div className="flex justify-between items-center">
            <div
              className={`flex items-center gap-2 font-semibold ${colorClass}`}
            >
              <Icon />
              {label}
            </div>
            <span className="text-2xl font-bold text-gray-900">{value}</span>
          </div>
          <div className="flex gap-1">
            {[0, 1, 2, 3, 4, 5].map((score) => (
              <button
                key={score}
                onClick={() => onChange(score)}
                className={`
                                flex-1 h-10 rounded-lg transition-all font-bold text-sm
                                ${
                                  value === score
                                    ? `bg-gray-900 text-white scale-110 shadow-md ring-2 ring-offset-2 ring-gray-200`
                                    : "bg-gray-100 text-gray-400 hover:bg-gray-200"
                                }
                            `}
              >
                {score}
              </button>
            ))}
          </div>
        </div>
      );

      function App() {
        // User State
        const [user, setUser] = useState(() => {
          const saved = localStorage.getItem("party_user");
          return saved ? JSON.parse(saved) : null;
        });
        const [tempName, setTempName] = useState("");
        const [tempTeam, setTempTeam] = useState(null);
        const [tempCostume, setTempCostume] = useState("");
        const [isRegistering, setIsRegistering] = useState(false);

        // --- NEW: Selection Voting State ---
        // We store an array of IDs that the user has selected locally but not yet submitted
        const [draftVotes, setDraftVotes] = useState([]);
        const [isSubmitting, setIsSubmitting] = useState(false);

        // Data State
        const [votesData, setVotesData] = useState([]);
        const [contestants, setContestants] = useState([]); // Dynamic Contestants List

        // 1. Firebase Listeners
        useEffect(() => {
          if (!window.db) {
            console.error("Firebase not initialized.");
            return;
          }
          const { collection, onSnapshot, query, orderBy } =
            window.firebaseData;

          // Listen to Votes
          const qVotes = query(
            collection(window.db, "votes"),
            orderBy("timestamp", "desc")
          );
          const unsubVotes = onSnapshot(qVotes, (snapshot) => {
            setVotesData(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
            );
          });

          // Listen to Contestants
          const qContestants = query(
            collection(window.db, "contestants"),
            orderBy("createdAt", "desc")
          );
          const unsubContestants = onSnapshot(qContestants, (snapshot) => {
            setContestants(
              snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
            );
          });

          return () => {
            unsubVotes();
            unsubContestants();
          };
        }, []);

        // Handlers
        const handleRegister = async () => {
          if (!tempName || !tempTeam || !tempCostume) return;
          setIsRegistering(true);
          try {
            const { collection, addDoc, serverTimestamp } = window.firebaseData;

            // Add user to 'contestants' collection
            const docRef = await addDoc(collection(window.db, "contestants"), {
              name: tempName,
              team: tempTeam,
              costumeTitle: tempCostume,
              createdAt: serverTimestamp(),
            });

            // Save local session
            const userData = {
              id: docRef.id,
              name: tempName,
              team: tempTeam,
              costumeTitle: tempCostume,
            };
            localStorage.setItem("party_user", JSON.stringify(userData));
            setUser(userData);
          } catch (error) {
            console.error("Error registering:", error);
            alert("เกิดข้อผิดพลาดในการลงทะเบียน");
          } finally {
            setIsRegistering(false);
          }
        };

        const handleLogout = async () => {
          if (
            confirm(
              "ทบทวนอีกครั้ง: การออกจากระบบจะลบข้อมูลการลงทะเบียนและคะแนนที่คุณโหวตทั้งหมด คุณแน่ใจหรือไม่?"
            )
          ) {
            try {
              const {
                deleteDoc,
                doc,
                collection,
                query,
                where,
                getDocs,
                writeBatch,
              } = window.firebaseData;

              // 1. Delete Contestant
              if (user.id) {
                await deleteDoc(doc(window.db, "contestants", user.id));
              }

              // 2. Delete Votes by this user
              const qVotes = query(
                collection(window.db, "votes"),
                where("voterName", "==", user.name),
                where("voterTeam", "==", user.team)
              );
              const snapshot = await getDocs(qVotes);

              const batch = writeBatch(window.db);
              snapshot.docs.forEach((doc) => {
                batch.delete(doc.ref);
              });
              await batch.commit();

              // 3. Clear Local State
              localStorage.removeItem("party_user");
              setUser(null);
              setTempName("");
              setTempTeam(null);
              setTempCostume("");
              setDraftVotes([]); // Reset drafts
            } catch (error) {
              console.error("Error during cleanup:", error);
              alert("เกิดข้อผิดพลาดในการลบข้อมูล แต่จะทำการออกจากระบบ");
              localStorage.removeItem("party_user");
              setUser(null);
              setTempName("");
              setTempTeam(null);
              setTempCostume("");
            }
          }
        };

        // --- NEW: Toggle Vote Selection ---
        const toggleVote = (contestantId) => {
          setDraftVotes((prev) => {
            if (prev.includes(contestantId)) {
              return prev.filter((id) => id !== contestantId);
            } else {
              if (prev.length >= 3) return prev; // Max 3
              return [...prev, contestantId];
            }
          });
        };

        const submitAllVotes = async () => {
          if (!window.db) return;
          if (draftVotes.length !== 3) {
            alert("กรุณาเลือกให้ครบ 3 คนก่อนส่งคะแนน");
            return;
          }

          setIsSubmitting(true);
          try {
            const { collection, addDoc, serverTimestamp, writeBatch, doc } =
              window.firebaseData;

            const batch = writeBatch(window.db);
            const votesRef = collection(window.db, "votes");

            draftVotes.forEach((cId) => {
              // Since firestore batch.set requires a document ref, but addDoc generates one automatically,
              // we can use doc(collectionRes) to generate a new ID ref
              const newVoteRef = doc(votesRef);
              batch.set(newVoteRef, {
                voterName: user.name,
                voterTeam: user.team,
                contestantId: cId,
                timestamp: serverTimestamp(),
              });
            });

            await batch.commit();

            setDraftVotes([]); // Clear drafts

            const toast = document.createElement("div");
            toast.className =
              "fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-xl z-50 animate-bounce font-medium";
            toast.innerText = "✅ บันทึกคะแนนโหวตแล้ว!";
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
          } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการส่งคะแนน");
          } finally {
            setIsSubmitting(false);
          }
        };

        // Check if user has ALREADY submitted votes (persistent in DB)
        // We assume: if user has ANY votes in DB, they are "done" ?
        // OR: Can they vote up to 3 times incrementally?
        // Requirement says "vote max 3 people", "login -> tick -> submit".
        // Implies a single session or cumulative. Let's support cumulative up to 3 for flexibility.
        const myExistingVotes = useMemo(
          () =>
            user ? votesData.filter((v) => v.voterName === user.name) : [],
          [votesData, user]
        );

        const hasFinishedVoting = myExistingVotes.length >= 3;

        // Views
        if (!user) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
              <motion.div
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                className="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white"
              >
                <div className="text-center mb-8">
                  <h1 className="text-4xl font-extrabold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                    Magic Neverland
                  </h1>
                  <p className="text-gray-500">
                    ลงทะเบียนคอสตูมของคุณเพื่อเริ่มงาน
                  </p>
                </div>

                <div className="space-y-5">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      ชื่อของคุณ
                    </label>
                    <input
                      type="text"
                      className="w-full px-4 py-3 rounded-xl bg-gray-50 border-2 border-gray-100 focus:border-purple-500 focus:ring-0 outline-none transition-all"
                      placeholder="เช่น น้องมายด์ บัญชี"
                      value={tempName}
                      onChange={(e) => setTempName(e.target.value)}
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      ชื่อชุดคอสตูมของคุณ (Costume Title)
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <Icons.Shirt />
                      </div>
                      <input
                        type="text"
                        className="w-full pl-10 pr-4 py-3 rounded-xl bg-gray-50 border-2 border-gray-100 focus:border-purple-500 focus:ring-0 outline-none transition-all"
                        placeholder="เช่น ราชินีเอลซ่า"
                        value={tempCostume}
                        onChange={(e) => setTempCostume(e.target.value)}
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      ทีมสีของคุณ
                    </label>
                    <div className="grid grid-cols-2 gap-3">
                      {Object.entries(TEAMS).map(([key, t]) => (
                        <button
                          key={key}
                          onClick={() => setTempTeam(key)}
                          className={`
                                                    p-3 rounded-xl border-2 transition-all text-sm font-semibold flex items-center justify-center gap-2
                                                    ${
                                                      tempTeam === key
                                                        ? `${t.bg} ${t.border} ${t.color} ring-2 ring-offset-1 ring-${key}-400`
                                                        : "border-gray-100 hover:border-gray-200 text-gray-500 bg-white"
                                                    }
                                                `}
                        >
                          <div
                            className={`w-3 h-3 rounded-full bg-gradient-to-br ${t.gradient}`}
                          ></div>
                          {t.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <Button
                    onClick={handleRegister}
                    disabled={
                      !tempName || !tempTeam || !tempCostume || isRegistering
                    }
                    className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-purple-200 mt-4"
                  >
                    {isRegistering
                      ? "กำลังบันทึก..."
                      : "ลงทะเบียนและเข้างาน 🎉"}
                  </Button>
                </div>
              </motion.div>
            </div>
          );
        }

        return (
          <div className="min-h-screen pb-32 max-w-md mx-auto relative bg-gray-50/50">
            {/* Header */}
            <header className="sticky top-0 z-20 glass-panel px-6 py-4 flex justify-between items-center rounded-b-3xl shadow-sm">
              <div>
                <h2 className="font-bold text-xl bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                  Magic Neverland
                </h2>
                <div className="flex items-center gap-2 mt-1">
                  <span className="text-xs text-gray-500 truncate max-w-[120px]">
                    {user.name} ({user.costumeTitle})
                  </span>
                  <TeamBadge team={user.team} />
                </div>
              </div>
              <Button variant="ghost" onClick={handleLogout} className="!p-2">
                <Icons.LogOut />
              </Button>
            </header>

            {/* Content Area - NO TABS ANYMORE */}
            <main className="px-4 space-y-4 mt-6">
              <motion.div
                initial={{ opacity: 0, x: -20 }}
                animate={{ opacity: 1, x: 0 }}
                className="space-y-6"
              >
                {/* Quota Banner */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                  <div className="text-sm font-medium text-gray-600">
                    สิทธิ์โหวตของคุณ
                  </div>
                  <div className="flex gap-1.5">
                    {[1, 2, 3].map((i) => {
                      const isUsed =
                        i <= myExistingVotes.length + draftVotes.length;
                      return (
                        <div
                          key={i}
                          className={`w-3 h-3 rounded-full ${
                            isUsed ? "bg-purple-500" : "bg-gray-200"
                          }`}
                        ></div>
                      );
                    })}
                  </div>
                </div>

                {Object.entries(TEAMS).map(([teamKey, teamData]) => {
                  // Filter contestants dynamically from DB state
                  const teamMembers = contestants.filter(
                    (c) => c.team === teamKey
                  );

                  return (
                    <div
                      key={teamKey}
                      className={`rounded-3xl p-5 ${teamData.bg} border ${teamData.border} relative overflow-hidden transition-all duration-300`}
                    >
                      <div
                        className={`absolute -right-4 -top-4 w-24 h-24 bg-gradient-to-br ${teamData.gradient} opacity-10 rounded-full blur-2xl`}
                      ></div>

                      <h3
                        className={`font-bold text-lg mb-4 flex items-center gap-2 ${teamData.color}`}
                      >
                        <div
                          className={`w-2 h-6 rounded-full bg-gradient-to-b ${teamData.gradient}`}
                        ></div>
                        {teamData.name}
                        <span className="text-xs opacity-60 font-normal">
                          ({teamMembers.length} คน)
                        </span>
                      </h3>

                      <div className="space-y-3">
                        {teamMembers.length === 0 ? (
                          <div className="text-center py-4 text-gray-400 text-xs bg-white/40 rounded-xl">
                            ยังไม่มีผู้ลงทะเบียนในทีมนี้
                          </div>
                        ) : (
                          teamMembers.map((contestant) => {
                            const isSelf = contestant.name === user.name;
                            const alreadyVotedInDb = myExistingVotes.some(
                              (v) => v.contestantId === contestant.id
                            );
                            const isDraftSelected = draftVotes.includes(
                              contestant.id
                            );

                            const isLimitReached =
                              myExistingVotes.length + draftVotes.length >= 3;
                            const isDisabled =
                              isSelf ||
                              alreadyVotedInDb ||
                              (isLimitReached && !isDraftSelected);

                            return (
                              <div
                                key={contestant.id}
                                onClick={() => {
                                  if (!isDisabled) toggleVote(contestant.id);
                                }}
                                className={`
                                    p-4 rounded-xl shadow-sm border flex justify-between items-center relative overflow-hidden cursor-pointer transition-all
                                    ${
                                      isSelf
                                        ? "bg-amber-50 border-amber-200"
                                        : isDraftSelected
                                        ? "bg-purple-50 border-purple-500 ring-1 ring-purple-500"
                                        : "bg-white border-gray-100 hover:border-gray-200"
                                    }
                                    ${
                                      isDisabled && !alreadyVotedInDb && !isSelf
                                        ? "opacity-50"
                                        : ""
                                    }
                                `}
                              >
                                {alreadyVotedInDb && (
                                  <div className="absolute inset-0 bg-gray-50/80 backdrop-blur-[1px] flex items-center justify-center z-10 cursor-default">
                                    <span className="text-xs font-bold text-green-600 bg-green-100 px-3 py-1 rounded-full border border-green-200">
                                      โหวตแล้ว ✅
                                    </span>
                                  </div>
                                )}

                                <div className="flex-1 min-w-0 pr-2">
                                  <p className="font-bold text-gray-900 truncate flex items-center gap-2">
                                    {contestant.name}
                                    {isSelf && (
                                      <span className="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full border border-amber-200">
                                        คุณ
                                      </span>
                                    )}
                                  </p>
                                  <div className="flex items-center gap-1.5 mt-1">
                                    <Icons.User />
                                    <span className="text-xs text-gray-500 truncate">
                                      {contestant.costumeTitle}
                                    </span>
                                  </div>
                                </div>

                                {!isSelf ? (
                                  <div
                                    className={`
                                    w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all
                                    ${
                                      isDraftSelected
                                        ? "bg-purple-500 border-purple-500"
                                        : "border-gray-300 bg-white"
                                    }
                                    `}
                                  >
                                    {isDraftSelected && (
                                      <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        className="h-4 w-4 text-white"
                                        viewBox="0 0 20 20"
                                        fill="currentColor"
                                      >
                                        <path
                                          fillRule="evenodd"
                                          d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                          clipRule="evenodd"
                                        />
                                      </svg>
                                    )}
                                  </div>
                                ) : (
                                  <div className="px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 text-xs font-semibold border border-amber-200 opacity-60">
                                    คือตัวคุณ
                                  </div>
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  );
                })}
              </motion.div>
            </main>

            {/* Sticky Footer for Submission */}
            <AnimatePresence>
              {draftVotes.length > 0 && (
                <motion.div
                  initial={{ y: 100 }}
                  animate={{ y: 0 }}
                  exit={{ y: 100 }}
                  className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-50 rounded-t-3xl max-w-md mx-auto"
                >
                  <div className="flex items-center justify-between gap-4">
                    <div>
                      <div className="text-sm font-bold text-gray-900">
                        เลือกแล้ว {draftVotes.length} คน
                      </div>
                      <div className="text-xs text-gray-500">
                        ต้องเลือกให้ครบ 3 คน
                      </div>
                    </div>
                    <Button
                      onClick={submitAllVotes}
                      disabled={isSubmitting || draftVotes.length !== 3}
                      className={`flex-1 text-white shadow-lg ${
                        draftVotes.length === 3
                          ? "bg-gradient-to-r from-purple-600 to-pink-600 shadow-purple-200"
                          : "bg-gray-400 cursor-not-allowed"
                      }`}
                    >
                      {isSubmitting
                        ? "กำลังบันทึก..."
                        : draftVotes.length === 3
                        ? "ยืนยันการโหวต"
                        : `เลือกอีก ${3 - draftVotes.length} คน`}
                    </Button>
                  </div>
                </motion.div>
              )}
            </AnimatePresence>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
